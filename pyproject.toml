[build-system]
requires = [
    "setuptools>=80.3.1",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "uvlhub_splent"
version = "0.0.1"
description = "uvlhub_splent is an app built with SPLENT (https://www.splent.io)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "watchdog",
    "locust",
]
core = [
    "splent_framework",
]

[tool.splent]
cli_version = "1.35.0"
features = [
    "splent-io/splent_feature_admin@v1.6.1",
    "splent-io/splent_feature_auth@v1.20.0",
    "splent-io/splent_feature_mail@v1.4.4",
    "splent-io/splent_feature_nginx@v1.2.0",
    "splent-io/splent_feature_profile@v1.6.0",
    "splent-io/splent_feature_public@v1.9.0",
    "splent-io/splent_feature_redis@v1.5.7",
    "splent-io/splent_feature_session_redis@v1.1.2",
    "splent-io/splent_feature_settings@v0.4.3",
    "splent-io/splent_feature_theme@v0.13.4",
    "splent-io/splent_feature_signup@v0.3.0",
    "splent-io/splent_feature_apikeys@v0.3.0",
    "splent-io/splent_feature_media@v0.9.1",
    "splent-io/splent_feature_elasticsearch@v0.1.2",
    "splent-io/splent_feature_generator",
    "splent-io/splent_feature_identities@v0.1.0",
    "splent-io/splent_feature_orcid@v0.1.0",
    "splent-io/splent_feature_github@v0.1.0",
    "splent-io/splent_feature_dataset@v0.1.1",
    "splent-io/splent_feature_hubfile@v0.1.1",
    "splent-io/splent_feature_explore@v0.1.1",
    "splent-io/splent_feature_autodeploy@v0.1.2",
    "splent-io/splent_feature_confirmemail@v1.3.0",
    "splent-io/splent_feature_reset@v1.5.0",
    "splent-io/splent_feature_team@v0.6.0",
    "splent-io/splent_feature_academic_profile@v0.1.0",
    "splent-io/splent_feature_featuremodel@v0.1.0",
    "splent-io/splent_feature_flamapy@v0.1.0",
    "splent-io/splent_feature_factlabel@v0.1.0",
    "splent-io/splent_feature_rating@v0.1.0",
    "splent-io/splent_feature_statistics@v0.1.0",
    "splent-io/splent_feature_zenodo@v0.1.0",
    "splent-io/splent_feature_apidocs@v0.1.0",
    "splent-io/splent_feature_captcha_image@v0.1.0",
]
features_dev = ["splent-io/splent_feature_mailhog@v1.1.0", "splent-io/splent_feature_phpmyadmin@v1.0.3"]
features_prod = []
spl = "openhubs_spl"

# Where the SPL model itself comes from. The name above is not enough
# to download anything, so the DOI travels with the product and any
# clone of this repository can resolve the model from UVLHub alone.
[tool.splent.spl_model]
mirror = "uvlhub.io"
doi = "10.5281/zenodo.23592345"
# Same line, every version. Used to report that a newer model exists.
concept_doi = ""
version = "2"
file = "openhubs_spl.uvl"

[tool.splent.config]
SITE_NAME = "uvlhub"
SITE_TAGLINE = "Repository of feature models in UVL format"
# The monolith accepted 20 MB; media alone would raise the whole app to 100 MB.
MEDIA_MAX_UPLOAD_SIZE = "20M"
# Media is only the internal library for team photos and logos.
MEDIA_PUBLIC_GALLERY = false
# Accounts loaded from uvlhub.io start as plain users; staff are promoted by hand.
AUTH_MIGRATION_LEGACY_ROLE = "user"
# Sign-up and reset ask for the new password twice, as uvlhub did.
AUTH_PASSWORD_CONFIRM = true
# The sidebar logo already leads home, so the sidebar has no Home entry.
PUBLIC_SIDEBAR_HOME_LINK = false
# Off: the hint would tell anyone typing an address that the account exists
# and which provider (ORCID, GitHub) it signs in with.
EXTERNAL_LOGIN_PASSWORD_HINT = false
# Tokens carry the dataset scopes only, the ones dataset registers.
APIKEYS_SCOPES = ["read_dataset", "write_dataset"]
# A token issued without a choice can read datasets but not upload them.
APIKEYS_DEFAULT_SCOPES = ["read_dataset"]
# uvlhub's API clients send the token in X-API-Key as well as Bearer.
APIKEYS_HEADER_ALIASES = ["X-API-Key"]
# Only the sign-up asks for the image captcha.
CAPTCHA_IMAGE_FORMS = ["signup"]
# The publisher named in every dataset's FAIR metadata, mails and API messages.
DATASET_PUBLISHER_NAME = "uvlhub"
# The catalog those metadata point to, the public site and not this host.
DATASET_CATALOG_URL = "https://www.uvlhub.io"
# The ball drawn in the middle of the PNG and JPG QR codes.
DATASET_QR_LOGO = "media/logos/uvlhub_ball.png"

[tool.splent.layout]
base_template = "base_template.html"
hooks = [
    "layout.head.css",
    "layout.sidebar.top",
    "layout.anonymous_sidebar",
    "layout.authenticated_sidebar",
    "layout.sidebar.authenticated.items",
    "layout.navbar.anonymous",
    "layout.header.menu",
    "layout.navbar.items",
    "layout.navbar.authenticated",
    "layout.footer",
    "layout.scripts",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]
