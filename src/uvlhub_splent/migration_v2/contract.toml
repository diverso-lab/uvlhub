[tables.dataset_rating]
owner = "splent_feature_rating"
role = "load"

[tables.dataset_rating.columns]
id = { type = "int(11)", nullable = false, source = "dataset_rating.id" }
user_id = { type = "int(11)", nullable = false, source = "dataset_rating.user_id" }
dataset_id = { type = "int(11)", nullable = false, rule = "the root of the voted dataset's lineage (DM-8)" }
is_like = { type = "tinyint(1)", nullable = false, source = "dataset_rating.is_like" }
created_at = { type = "datetime", nullable = false, source = "dataset_rating.created_at" }
updated_at = { type = "datetime", nullable = false, source = "dataset_rating.updated_at" }

[tables.dataset_transfer_request]
# Plan §5.7 asks for the reason "migration" on what it cancels, a column
# the table does not have: the report lists those offers.
owner = "splent_feature_dataset"
role = "load"

[tables.dataset_transfer_request.columns]
id = { type = "int(11)", nullable = false, source = "dataset_transfer_request.id" }
dataset_id = { type = "int(11)", nullable = false, source = "dataset_transfer_request.dataset_id" }
from_user_id = { type = "int(11)", nullable = false, source = "dataset_transfer_request.from_user_id" }
to_user_id = { type = "int(11)", nullable = false, source = "dataset_transfer_request.to_user_id" }
status = { type = "enum('PENDING','ACCEPTED','DECLINED','CANCELLED')", nullable = false, collation = "utf8mb4_unicode_ci", rule = "CANCELLED for a PENDING offer, as it was otherwise (D13 b)" }
message = { type = "varchar(500)", nullable = true, collation = "utf8mb4_unicode_ci", source = "dataset_transfer_request.message" }
created_at = { type = "datetime", nullable = false, source = "dataset_transfer_request.created_at" }
resolved_at = { type = "datetime", nullable = true, rule = "T0 for an offer it cancels, as it was otherwise" }

[tables.doi_mapping]
# dataset's /doi routes still redirect by it; E6 loads v2.12's (C-20), and
# imports the same aliases into legacy_urls' legacy_url.
owner = "splent_feature_dataset"
role = "load"

[tables.doi_mapping.columns]
id = { type = "int(11)", nullable = false, source = "doi_mapping.id" }
dataset_doi_old = { type = "varchar(120)", nullable = true, collation = "utf8mb4_unicode_ci", source = "doi_mapping.dataset_doi_old" }
dataset_doi_new = { type = "varchar(120)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "the end of its chain, a DOI a dataset of 3.0 has; a cycle or a dead end loads nowhere (C-20)" }

[tables.usage_daily]
# DM-5: v2.12's records by dataset or file, kind and day, as E6 aggregates
# them in uvlhub_migration.usage_daily, which statistics shows next to its
# own (source live).
owner = "splent_feature_statistics"
role = "load"

[tables.usage_daily.columns]
target_type = { type = "varchar(16)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "dataset or hubfile, the table the record counted (ds_* or hubfile_*_record)" }
target_id = { type = "int(11)", nullable = false, rule = "the record's dataset_id or file_id" }
kind = { type = "varchar(16)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "view or download, the table the record is in" }
day = { type = "date", nullable = false, rule = "DATE of the record's view_date or download_date" }
source = { type = "varchar(16)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "legacy_v2" }
visitors = { type = "int(11)", nullable = false, rule = "distinct accounts, else cookies, else records, that day (DM-5)" }
records = { type = "int(11)", nullable = false, rule = "the records of that day: not the owner's, of a published dataset loaded, with a target and a date" }

[tables.usage_note]
# DM-5: the public note that says why the figures went down.
owner = "splent_feature_statistics"
role = "load"

[tables.usage_note.columns]
source = { type = "varchar(16)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "legacy_v2" }
note = { type = "text", nullable = false, collation = "utf8mb4_unicode_ci", rule = "the report's dm5 note" }
until = { type = "date", nullable = true, rule = "the day before T0, the last the legacy figures count" }

[tables.hubfile_alias]
# DM-10: the old folder and name of every file E8 renames, whose
# /hubfiles/raw/<id>/<old name> answers a 308 to the new one.
owner = "splent_feature_hubfile"
role = "load"

[tables.hubfile_alias.columns]
id = { type = "int(11)", nullable = false, rule = "numbered by the table, in the order of the files" }
hubfile_id = { type = "int(11)", nullable = false, rule = "a file E8 renamed (DM-10, C-11)" }
directory_path = { type = "varchar(255)", nullable = false, collation = "utf8mb4_bin", source = "hubfiles.directory_path" }
name = { type = "varchar(120)", nullable = false, collation = "utf8mb4_bin", source = "hubfiles.name", rule = "the name v2.12 gave it, before ~<id>" }
created_at = { type = "datetime", nullable = false, rule = "T0" }

[tables.legacy_url]
# CO-2: the addresses of v2.12 that answer somewhere else now, through
# splent feature:legacy_urls import (E6).
owner = "splent_feature_legacy_urls"
role = "load"

[tables.legacy_url.columns]
id = { type = "int(11)", nullable = false, rule = "numbered by the import" }
path = { type = "varchar(512)", nullable = false, collation = "utf8mb4_bin", rule = "/doi/<dataset_doi_old>/ of a doi_mapping that loads (C-20)" }
target = { type = "varchar(1024)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "/doi/<the end of its chain>/" }
status = { type = "smallint(6)", nullable = false, rule = "308" }
ref = { type = "varchar(255)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "doi_mapping:<id>" }
created_at = { type = "datetime", nullable = false, rule = "T0" }
updated_at = { type = "datetime", nullable = false, rule = "T0" }

[tables.mail_outbox]
# D13 b, 5.5: the notices of the move, held until RB-2 ends (E6). E0 reads
# it too: a mail sent means 3.0 has opened.
owner = "splent_feature_mail"
role = "load"

[tables.mail_outbox.columns]
id = { type = "bigint(20)", nullable = false, rule = "numbered from 1 in the order of the notices" }
recipients = { type = "text", nullable = false, collation = "utf8mb4_unicode_ci", source = "user.email", rule = "the address of the account the notice is for", on_null = "no notice: an account without an address gets none, and the ledger notes it" }
sender = { type = "varchar(320)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "MAIL_FROM" }
reply_to = { type = "varchar(320)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "NULL" }
subject = { type = "varchar(998)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "the notice's, legacy.py" }
body_text = { type = "mediumtext", nullable = false, collation = "utf8mb4_unicode_ci", rule = "the notice, in English and Spanish, with no link (MIG-09)" }
body_html = { type = "mediumtext", nullable = true, collation = "utf8mb4_unicode_ci", rule = "NULL" }
retryable = { type = "tinyint(1)", nullable = false, rule = "1: no link, kept whole" }
state = { type = "varchar(16)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "held" }
attempts = { type = "int(11)", nullable = false, rule = "0" }
last_error = { type = "varchar(500)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "NULL" }
hold_tag = { type = "varchar(64)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "--hold-tag, rb2" }
created_at = { type = "datetime", nullable = false, rule = "T0" }
last_attempt_at = { type = "datetime", nullable = true, rule = "NULL" }
sent_at = { type = "datetime", nullable = true, rule = "NULL" }

