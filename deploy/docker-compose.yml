name: uvlhub_splent_deploy
x-required:
  ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required,
    set it in .env}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required, set it in .env}
  NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required, set it in
    .env}
  MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required, set it in .env}
  MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required, set it in .env}
  MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required, set it in .env}
  MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required, set it in .env}
  AUTODEPLOY_SECRET: ${AUTODEPLOY_SECRET:?AUTODEPLOY_SECRET is required, set it in
    .env}
  ZENODO_ACCESS_TOKEN: ${ZENODO_ACCESS_TOKEN:?ZENODO_ACCESS_TOKEN is required, set
    it in .env}
  OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:?OAUTH_REDIRECT_BASE_URL is required,
    set it in .env}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required, set it in .env}
  MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required, set it in .env}
  MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required,
    set it in .env}
  SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required, set it in .env}
services:
  uvlhub_splent_web_deploy:
    image: ${SPLENT_IMAGE:-uvlhub_splent:0.0.1}
    container_name: uvlhub_splent_web_deploy
    restart: unless-stopped
    env_file:
    - .env
    environment:
      PROTECTED_UPLOADS_DIR: ${PROTECTED_UPLOADS_DIR:-/workspace/uvlhub_splent/protected_uploads}
      ARCHIVE_DIR: ${ARCHIVE_DIR:-/workspace/uvlhub_splent/archive}
    ports:
    - ${SPLENT_WEB_BIND_HOST:-0.0.0.0}:${SPLENT_WEB_PORT:-5012}:5000
    volumes:
    - uvlhub_splent_web_deploy_uploads:/workspace/uvlhub_splent/src/uvlhub_splent/static/uploads
    - uvlhub_splent_web_deploy_protected_uploads:${PROTECTED_UPLOADS_DIR:-/workspace/uvlhub_splent/protected_uploads}
    - uvlhub_splent_web_deploy_archive:${ARCHIVE_DIR:-/workspace/uvlhub_splent/archive}
    depends_on:
      uvlhub_splent_db_deploy:
        condition: service_healthy
    command:
    - bash
    - -c
    - bash /workspace/uvlhub_splent/entrypoints/entrypoint.prod.sh
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - "import http.client as h\ndef status(path):\n    c = h.HTTPConnection('127.0.0.1',\
        \ 5000, timeout=4)\n    c.request('GET', path)\n    return c.getresponse().status\n\
        ready = status('/readyz')\nok = ready == 200 if ready in (200, 503) else status('/')\
        \ < 500\nraise SystemExit(not ok)\n"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    build:
      context: ..
      dockerfile: docker/Dockerfile.uvlhub_splent.prod
      args:
        SPLENT_FORGE_HOST: git.splent.io
  uvlhub_splent_db_deploy:
    image: mariadb:11.4
    container_name: uvlhub_splent_db_deploy
    restart: unless-stopped
    env_file:
    - .env
    command: --default-authentication-plugin=mysql_native_password
    ports:
    - ${SPLENT_DB_BIND_HOST:-127.0.0.1}:${SPLENT_DB_PORT:-33072}:3306
    volumes:
    - uvlhub_splent_db_deploy_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mariadb -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  splent_feature_elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.4
    restart: always
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=true
    - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required,
      set it in .env}
    - xpack.security.http.ssl.enabled=false
    - xpack.security.transport.ssl.enabled=false
    - ES_JAVA_OPTS=${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fs --variable %ELASTIC_PASSWORD --expand-user 'elastic:{{ELASTIC_PASSWORD}}'
        http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  splent_feature_redis:
    image: redis:7.4
    restart: always
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD:?REDIS_PASSWORD is required, set it in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required, set it in .env}
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping 2>/dev/null | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
  splent_feature_nginx:
    build:
      context: features/splent_feature_nginx
      dockerfile: Dockerfile.prod
    image: splent/splent_feature_nginx:latest
    restart: always
    ports:
    - ${NGINX_BIND_HOST:-0.0.0.0}:${NGINX_HTTP_HOST_PORT}:80
    - ${NGINX_BIND_HOST:-0.0.0.0}:${NGINX_HTTPS_HOST_PORT}:443
    volumes:
    - letsencrypt:/etc/letsencrypt:ro
    - certbot_webroot:/var/www/certbot:ro
    - ${SPLENT_HOST_DEPLOY_DIR:-.}/features/splent_feature_nginx/nginx/locations:/etc/nginx/conf.d/locations:ro
    environment:
    - NGINX_UPSTREAM_HOST=${NGINX_UPSTREAM_HOST}
    - NGINX_UPSTREAM_PORT=${NGINX_UPSTREAM_PORT}
    - NGINX_SERVER_NAME=${NGINX_SERVER_NAME}
    - NGINX_REDIRECT_SERVER_NAMES=${NGINX_REDIRECT_SERVER_NAMES:-}
    - NGINX_TRUSTED_PROXY_CIDRS=${NGINX_TRUSTED_PROXY_CIDRS:-}
    - NGINX_AUTH_RATE_LIMIT=${NGINX_AUTH_RATE_LIMIT:-60r/m}
    - NGINX_AUTH_RATE_BURST=${NGINX_AUTH_RATE_BURST:-30}
    - NGINX_LONG_REQUEST_TIMEOUT=${NGINX_LONG_REQUEST_TIMEOUT:-600s}
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  splent_feature_autodeploy:
    build:
      context: features/splent_feature_autodeploy
      dockerfile: Dockerfile
    container_name: ${AUTODEPLOY_AGENT_CONTAINER:-splent_feature_autodeploy}
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - autodeploy_data:/data
    environment:
    - SPLENT_APP=${SPLENT_APP:-}
    - SPLENT_IMAGE=${SPLENT_IMAGE:-}
    - AUTODEPLOY_IMAGE=${AUTODEPLOY_IMAGE:-}
    - AUTODEPLOY_INTERVAL=${AUTODEPLOY_INTERVAL:-300}
    - AUTODEPLOY_WINDOW=${AUTODEPLOY_WINDOW:-}
    - AUTODEPLOY_HEALTH_TIMEOUT=${AUTODEPLOY_HEALTH_TIMEOUT:-600}
    - AUTODEPLOY_KEEP_BACKUPS=${AUTODEPLOY_KEEP_BACKUPS:-5}
    - AUTODEPLOY_MIGRATE_COMMAND=${AUTODEPLOY_MIGRATE_COMMAND:-splent db:upgrade}
    - AUTODEPLOY_READY_PATH=${AUTODEPLOY_READY_PATH:-/readyz}
    - AUTODEPLOY_WEB_PORT=${AUTODEPLOY_WEB_PORT:-5000}
    - AUTODEPLOY_BACKUP_COMMAND=${AUTODEPLOY_BACKUP_COMMAND:-auto}
    - AUTODEPLOY_APP_USER=${AUTODEPLOY_APP_USER:-splent}
    - AUTODEPLOY_WEB_CONTAINER=${AUTODEPLOY_WEB_CONTAINER:-}
    - AUTODEPLOY_DB_CONTAINER=${AUTODEPLOY_DB_CONTAINER:-}
    - AUTODEPLOY_REGISTRY_USER=${AUTODEPLOY_REGISTRY_USER:-}
    - AUTODEPLOY_REGISTRY_TOKEN=${AUTODEPLOY_REGISTRY_TOKEN:-}
    - AUTODEPLOY_SECRET=${AUTODEPLOY_SECRET:-}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; socket.create_connection(('127.0.0.1', 8080), 3).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    image: splent/splent_feature_autodeploy:latest
volumes:
  uvlhub_splent_db_deploy_data: null
  uvlhub_splent_web_deploy_uploads: null
  uvlhub_splent_web_deploy_protected_uploads: null
  uvlhub_splent_web_deploy_archive: null
  elasticsearch_data: null
  redis_data: null
  letsencrypt: null
  certbot_webroot: null
  autodeploy_data: null
