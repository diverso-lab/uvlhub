multi_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.multi_features" }
tree_relationships = { type = "int(11)", nullable = true, source = "hubfile_metrics.tree_relationships" }
mandatory_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.mandatory_features" }
optional_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.optional_features" }
feature_groups = { type = "int(11)", nullable = true, source = "hubfile_metrics.feature_groups" }
alternative_groups = { type = "int(11)", nullable = true, source = "hubfile_metrics.alternative_groups" }
or_groups = { type = "int(11)", nullable = true, source = "hubfile_metrics.or_groups" }
mutex_groups = { type = "int(11)", nullable = true, source = "hubfile_metrics.mutex_groups" }
cardinality_groups = { type = "int(11)", nullable = true, source = "hubfile_metrics.cardinality_groups" }
depth_of_tree = { type = "int(11)", nullable = true, source = "hubfile_metrics.depth_of_tree" }
mean_depth_of_tree = { type = "float", nullable = true, source = "hubfile_metrics.mean_depth_of_tree" }
branching_factor = { type = "float", nullable = true, source = "hubfile_metrics.branching_factor" }
min_children_per_feature = { type = "int(11)", nullable = true, source = "hubfile_metrics.min_children_per_feature" }
