abstract_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.abstract_features" }
concrete_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.concrete_features" }
leaf_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.leaf_features" }
compound_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.compound_features" }
top_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.top_features" }
solitary_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.solitary_features" }
grouped_features = { type = "int(11)", nullable = true, source = "hubfile_metrics.grouped_features" }
