# The data contract of uvlhub 3.0 that the migrator of uvlhub.io 2.12 writes
# to (MIG-03, §3.4 of the migration plan).
#
# It says what the schema of the pinned features looks like where the
# migrator touches it, and where every column it fills comes from. The
# migrator reads it twice: E0 refuses to run on features of other versions
# than [features] names, and E3 refuses a uvlhub3 that differs from
# [tables] (V-12, V-14). tests/migration_v2/test_contract.py compares it with
# the schema the pinned features create, so a pin that changes a table the
# migration fills fails there first. Every change of F1 to F5 that touches
# data carried over updates this file and the migrator in the same commit
# (plancha:41).
#
# Tables have a role:
#   load   the migrator writes it. Its columns are the table's, all of them,
#          each with where it comes from: `source` (a v2.12 column copied as
#          it is) and/or `rule` (what the migrator computes), and `on_null`
#          when the source admits NULL and the target does not (C-27).
#   read   the migrator reads the columns listed (a subset), and writes nothing.
#   empty  the migrator writes nothing, and E7 checks that nothing else did
#          either (a seed, a listener). Its columns are the feature's business.
#   derived the migrator writes nothing; E9 has the features' commands fill
#          it, and E7, before them, checks that nothing did yet.
# `owner` is the feature whose migrations create the table.
#
# Collations (DM-15): the database's default for every text column, but
# where the column says otherwise: utf8mb4_bin for the identifiers, which
# auth (1.27.0: email, email_canonical) and identities (0.5.0: provider,
# provider_id) compare exactly. `dm15` names the collation DM-15 asks for
# where a pinned feature does not give it yet (datasets.pid, which dataset
# 0.10.0 leaves at the database's): V-14 checks `collation`, what the schema
# is, and the report lists every `dm15` still pending, with [dm15] missing
# below.

[contract]
version = 3
plan = "_reference/analisis_uvlhub/06-plan-migracion-uvlhubio.md, revision 2"

[database]
charset = "utf8mb4"
collation = "utf8mb4_unicode_ci"

# The heads the migrator was written against: feature, version and the last
# revision db:upgrade records for it in splent_migrations. Every feature with
# migrations of the product, so V-12 compares the whole of splent_migrations.
[features]
splent_feature_academic_profile = { version = "0.1.0", head = "pu0002" }
splent_feature_apikeys = { version = "0.10.0", head = "apikeys0003_resources" }
splent_feature_audit = { version = "0.1.0", head = "audit0001_events" }
splent_feature_auth = { version = "1.27.0", head = "auth0009_email_collation" }
splent_feature_citation = { version = "0.1.0", head = "citation0001_references" }
splent_feature_confirmemail = { version = "2.3.0", head = "confirmemail0002_drop_scaffold" }
splent_feature_curation = { version = "0.1.0", head = "curation0001_requests" }
splent_feature_dataset = { version = "0.11.0", head = "dataset0009_public_ids" }
splent_feature_factlabel = { version = "0.6.0", head = "d934ec20c841" }
splent_feature_github = { version = "0.4.1", head = "github0002_into_ext_identity" }
splent_feature_hubfile = { version = "0.9.0", head = "hubfile0004_aliases" }
splent_feature_identities = { version = "0.5.0", head = "identities0003_exact_ids" }
splent_feature_legacy_urls = { version = "0.1.0", head = "legacy_urls0001_urls" }
splent_feature_mail = { version = "1.6.0", head = "mail0002_held" }
splent_feature_media = { version = "0.11.2", head = "media0005_thumbnail" }
splent_feature_orcid = { version = "0.4.1", head = "orcid0002_into_external_identity" }
splent_feature_profile = { version = "1.8.0", head = "29f0c82ca134" }
splent_feature_rating = { version = "0.5.0", head = "3e72750db961" }
splent_feature_reset = { version = "2.3.0", head = "1c2ed70161dd" }
splent_feature_settings = { version = "0.5.1", head = "settings0001" }
splent_feature_statistics = { version = "0.5.0", head = "statistics0002_usage" }
splent_feature_team = { version = "0.9.1", head = "tm0004_role_details" }
splent_feature_uvl = { version = "0.2.1", head = "846acdf9eed2" }

# The heads of v2.12 the dump may be at (MIGRATION_EXPECTED_HEAD): the
# release, or the hotfix D1, whose revision only rewrites descriptions.
[source]
heads = ["e5f6a7b8c9d0", "f7a8b9c0d1e2"]

# The scopes of a v2.12 key and the ones the token keeps. They stay as they
# were: the pinned dataset registers uvlhub's own names (read_dataset,
# write_dataset), and with dataset_api (AP-4) they are aliases of its
# datasets:* scopes, so a 2.12 key keeps what it could do. A scope not named
# here is dropped from the token, and counted.
[scopes]
read_dataset = "read_dataset"
write_dataset = "write_dataset"

# What DM-15 asks for that no pinned feature has: E5 cannot fill a column
# that does not exist. The report lists them with the `dm15` columns.
[dm15]
missing = [
    "dataset_tag.name (C-23: tags stay a string in ds_meta_data.tags)",
]

[tables.user]
owner = "splent_feature_auth"
role = "load"

[tables.user.columns]
id = { type = "int(11)", nullable = false, source = "user.id" }
email = { type = "varchar(256)", nullable = true, collation = "utf8mb4_bin", source = "user.email" }
password = { type = "varchar(256)", nullable = false, collation = "utf8mb4_unicode_ci", source = "user.password" }
created_at = { type = "datetime", nullable = false, source = "user.created_at" }
role = { type = "varchar(32)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "admin for MIGRATION_ADMIN_EMAILS, user otherwise (5.3)" }
email_canonical = { type = "varchar(256)", nullable = true, collation = "utf8mb4_bin", rule = "auth's canonical_email(user.email)" }
pending_email = { type = "varchar(256)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "NULL" }
email_verified_at = { type = "datetime", nullable = true, rule = "when the earliest positive proof was made (5.1), NULL without one" }
disabled_at = { type = "datetime", nullable = true, rule = "T0 when user.active = 0" }
last_login_at = { type = "datetime", nullable = true, rule = "NULL" }
password_changed_at = { type = "datetime", nullable = true, rule = "NULL" }
session_version = { type = "int(11)", nullable = false, rule = "2, which ends every remember-me cookie of v2.12 (5.4)" }
account_origin = { type = "varchar(32)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "legacy_v2" }
email_verified_via = { type = "varchar(32)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "legacy_reset or legacy_github, NULL without a proof" }
has_usable_password = { type = "tinyint(1)", nullable = false, rule = "5.2 heuristic" }
is_service_account = { type = "tinyint(1)", nullable = false, rule = "false" }
must_reset_password = { type = "tinyint(1)", nullable = false, rule = "1 for a probable takeover (C-28), whose password then opens nothing but mails its owner a reset link; 0 otherwise" }

[tables.user_profile]
owner = "splent_feature_profile"
role = "load"

[tables.user_profile.columns]
id = { type = "int(11)", nullable = false, source = "user_profile.id" }
user_id = { type = "int(11)", nullable = false, source = "user_profile.user_id" }
name = { type = "varchar(100)", nullable = false, collation = "utf8mb4_unicode_ci", source = "user_profile.name", rule = "stripped" }
surname = { type = "varchar(100)", nullable = false, collation = "utf8mb4_unicode_ci", source = "user_profile.surname", rule = "stripped" }
affiliation = { type = "varchar(255)", nullable = true, collation = "utf8mb4_unicode_ci", source = "user_profile.affiliation", rule = "stripped; academic_profile adds the column" }

[tables.external_identity]
owner = "splent_feature_identities"
role = "load"

[tables.external_identity.columns]
id = { type = "int(11)", nullable = false, source = "external_identity.id", rule = "kept; a row folded in from orcid or github takes a new one above the source counter" }
user_id = { type = "int(11)", nullable = false, source = "external_identity.user_id" }
provider = { type = "varchar(50)", nullable = false, collation = "utf8mb4_bin", source = "external_identity.provider", rule = "orcid or github exactly, the case and spaces of v2.12 aside; any other provider is a conflict" }
provider_id = { type = "varchar(256)", nullable = false, collation = "utf8mb4_bin", source = "external_identity.provider_id", rule = "orcid.orcid_id normalised, or github.github_id as text, for a folded row (5.6)" }
provider_username = { type = "varchar(256)", nullable = true, collation = "utf8mb4_unicode_ci", source = "external_identity.provider_username", rule = "the iD, or github.github_login, when it had none (orcid0002, github0002)" }
created_at = { type = "datetime", nullable = false, source = "external_identity.created_at", rule = "the earlier of the two dates of a folded row" }
provider_email_verified = { type = "varchar(256)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "external_identity.email of a github row when it is the account's address (identities0002)" }

[tables.api_token]
owner = "splent_feature_apikeys"
role = "load"

[tables.api_token.columns]
id = { type = "int(11)", nullable = false, source = "api_keys.id" }
user_id = { type = "int(11)", nullable = false, source = "api_keys.user_id" }
name = { type = "varchar(128)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "'uvlhub 2 key (<created_at date>)'" }
token_hash = { type = "varchar(64)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "sha256(api_keys.key)" }
prefix = { type = "varchar(16)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "api_keys.key[:15]" }
scopes = { type = "varchar(256)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "api_keys.scopes through [scopes] below; a key whose scopes all go is carried over revoked" }
created_at = { type = "datetime", nullable = false, source = "api_keys.created_at", on_null = "api_keys.last_used_at, else T0 (D12)" }
expires_at = { type = "datetime", nullable = true, rule = "T0 + 90 days with write_dataset, 365 otherwise (D12)" }
revoked_at = { type = "datetime", nullable = true, rule = "T0 for a key carried over revoked (D12)" }
last_used_at = { type = "datetime", nullable = true, source = "api_keys.last_used_at" }
revoked_reason = { type = "varchar(32)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "import_no_scopes, import_never_used or import_unused (D12)" }
expiry_notice_days = { type = "int(11)", nullable = true, rule = "NULL" }

[tables.ds_metrics]
owner = "splent_feature_dataset"
role = "load"

[tables.ds_metrics.columns]
id = { type = "int(11)", nullable = false, source = "ds_metrics.id" }
number_of_models = { type = "int(11)", nullable = true, source = "ds_metrics.number_of_models" }
number_of_features = { type = "int(11)", nullable = true, source = "ds_metrics.number_of_features" }

[tables.ds_meta_data]
owner = "splent_feature_dataset"
role = "load"

[tables.ds_meta_data.columns]
id = { type = "int(11)", nullable = false, source = "ds_meta_data.id" }
deposition_id = { type = "int(11)", nullable = true, source = "ds_meta_data.deposition_id" }
title = { type = "varchar(120)", nullable = false, collation = "utf8mb4_unicode_ci", source = "ds_meta_data.title" }
description = { type = "text", nullable = false, collation = "utf8mb4_unicode_ci", source = "ds_meta_data.description" }
publication_type = { type = "enum('ANNOTATION_COLLECTION','BOOK','BOOK_SECTION','CONFERENCE_PAPER','DATA_MANAGEMENT_PLAN','JOURNAL_ARTICLE','PATENT','PREPRINT','PROJECT_DELIVERABLE','PROJECT_MILESTONE','PROPOSAL','REPORT','SOFTWARE_DOCUMENTATION','TAXONOMIC_TREATMENT','TECHNICAL_NOTE','THESIS','WORKING_PAPER','OTHER')", nullable = true, collation = "utf8mb4_unicode_ci", source = "ds_meta_data.publication_type" }
publication_doi = { type = "varchar(120)", nullable = true, collation = "utf8mb4_unicode_ci", source = "ds_meta_data.publication_doi" }
dataset_doi = { type = "varchar(120)", nullable = true, collation = "utf8mb4_unicode_ci", source = "ds_meta_data.dataset_doi" }
dataset_concept_doi = { type = "varchar(120)", nullable = true, collation = "utf8mb4_unicode_ci", source = "ds_meta_data.dataset_concept_doi" }
api_publisher_user_id = { type = "int(11)", nullable = true, source = "ds_meta_data.api_publisher_user_id", rule = "NULL when that account is not loaded" }
tags = { type = "varchar(120)", nullable = true, collation = "utf8mb4_unicode_ci", source = "ds_meta_data.tags" }
ds_metrics_id = { type = "int(11)", nullable = true, source = "ds_meta_data.ds_metrics_id" }
dataset_anonymous = { type = "tinyint(1)", nullable = true, source = "ds_meta_data.dataset_anonymous" }
metadata_synced = { type = "tinyint(1)", nullable = false, source = "ds_meta_data.metadata_synced" }
private_authors = { type = "longtext", nullable = true, collation = "utf8mb4_bin", rule = "the authors of an anonymous dataset, as dataset0003 moves them, each as an author row below (Author.entry)" }
authors_declared_at = { type = "datetime", nullable = true, rule = "NULL: nobody declared the co-authors in v2.12, and nothing asks it now (D18)" }
authors_declared_by_id = { type = "int(11)", nullable = true, rule = "NULL (D18)" }

[tables.datasets]
owner = "splent_feature_dataset"
role = "load"

[tables.datasets.columns]
id = { type = "int(11)", nullable = false, source = "datasets.id", rule = "kept; a tombstone takes a new one above the source's counter (DM-4)" }
user_id = { type = "int(11)", nullable = false, source = "datasets.user_id", rule = "a tombstone's is the first account of MIGRATION_ADMIN_EMAILS (DM-4, DM-13)" }
ds_meta_data_id = { type = "int(11)", nullable = false, source = "datasets.ds_meta_data_id", rule = "a tombstone's is the metadata left without a dataset" }
created_at = { type = "datetime", nullable = false, source = "datasets.created_at", rule = "a tombstone's is its record's in zenodo_snapshot, else T0, with a conflict (DM-4)" }
feature_model_count = { type = "int(11)", nullable = false, rule = "the feature models loaded for the dataset; 0 for a tombstone" }
dataset_version = { type = "int(11)", nullable = false, source = "datasets.dataset_version", rule = "1 for a tombstone" }
dataset_origin_id = { type = "int(11)", nullable = true, source = "datasets.dataset_origin_id", rule = "NULL when the origin is not loaded, with a conflict (C-05)" }
updated_at = { type = "datetime", nullable = false, rule = "datasets.created_at (dataset0002), or the tombstone's" }
status = { type = "varchar(20)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "dataset's state_from_metadata (4.3); withdrawn for a tombstone (DM-4)" }
visibility = { type = "varchar(32)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "dataset's state_from_metadata (4.3)" }
publisher_record_id = { type = "varchar(255)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "ds_meta_data.deposition_id as text" }
published_at = { type = "datetime", nullable = true, rule = "datasets.created_at when published (first pass; Zenodo's date in the final E5); a tombstone's record's publication_date" }
withdrawn_at = { type = "datetime", nullable = true, rule = "NULL: v2.12 kept no date of a deletion" }
withdrawal_reason = { type = "varchar(32)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "other for a tombstone (DM-4), NULL otherwise" }
withdrawal_note = { type = "varchar(500)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "content.TOMBSTONE_NOTE for a tombstone, NULL otherwise" }
withdrawn_by_id = { type = "int(11)", nullable = true, rule = "NULL" }
provider = { type = "varchar(32)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "zenodo when ds_meta_data has a DOI or a deposition_id, NULL otherwise (dataset0005)" }
pid = { type = "varchar(255)", nullable = true, collation = "utf8mb4_unicode_ci", dm15 = "utf8mb4_bin", rule = "ds_meta_data.dataset_doi, which stays there too, NULL without one (dataset0005)" }
pid_scheme = { type = "varchar(16)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "doi with a pid, NULL otherwise (dataset0005)" }
publication_error = { type = "longtext", nullable = true, collation = "utf8mb4_bin", rule = "NULL" }
public_id = { type = "varchar(26)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "a ULID of created_at whose random bits are the first 80 of HMAC-SHA256(MIGRATION_PUBLIC_ID_KEY, 'dataset:<id>'), the same every run (CO-5, 4.2)" }
lineage_root_id = { type = "int(11)", nullable = true, rule = "the first version of its lineage as it loads, its own id for an original or a tombstone (DL-9)" }
concept_pid = { type = "varchar(255)", nullable = true, collation = "utf8mb4_bin", rule = "ds_meta_data.dataset_concept_doi stripped, NULL without one (dataset0009, CT-4)" }

[tables.author]
owner = "splent_feature_dataset"
role = "load"

[tables.author.columns]
id = { type = "int(11)", nullable = false, source = "author.id" }
name = { type = "varchar(120)", nullable = false, collation = "utf8mb4_unicode_ci", source = "author.name" }
affiliation = { type = "varchar(120)", nullable = true, collation = "utf8mb4_unicode_ci", source = "author.affiliation" }
orcid = { type = "varchar(19)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "author.orcid normalised, NULL when it is not a valid iD (C-15)" }
ds_meta_data_id = { type = "int(11)", nullable = false, source = "author.ds_meta_data_id", on_null = "not loaded: an author of no metadata is dropped as an orphan (P-02)" }
position = { type = "int(11)", nullable = false, rule = "its place in its metadata's credit, from 0 in the order of the ids (dataset0007)" }
given_name = { type = "varchar(120)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "the part after the comma of a name written \"Family, Given\", with exactly one comma (dataset's names_of); NULL otherwise" }
family_name = { type = "varchar(120)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "the part before that comma; NULL otherwise" }
user_id = { type = "int(11)", nullable = true, rule = "the account whose orcid row of external_identity has the author's iD, NULL without one" }

[tables.feature_model]
# uvl's, which took it over from featuremodel as it was (846acdf9eed2).
owner = "splent_feature_uvl"
role = "load"

[tables.feature_model.columns]
id = { type = "int(11)", nullable = false, source = "feature_model.id" }
dataset_id = { type = "int(11)", nullable = false, rule = "the dataset of its hubfile, else feature_model.dataset_id (C-07)" }

[tables.hubfiles]
owner = "splent_feature_hubfile"
role = "load"

[tables.hubfiles.columns]
id = { type = "int(11)", nullable = false, source = "hubfiles.id" }
name = { type = "varchar(120)", nullable = false, collation = "utf8mb4_unicode_ci", source = "hubfiles.name", rule = "~<id> before the extension of every file but the first on a path, written by E8 (DM-10, C-11)" }
directory_path = { type = "varchar(255)", nullable = false, collation = "utf8mb4_unicode_ci", source = "hubfiles.directory_path" }
checksum = { type = "varchar(120)", nullable = false, collation = "utf8mb4_unicode_ci", source = "hubfiles.checksum" }
size = { type = "int(11)", nullable = false, source = "hubfiles.size" }
dataset_id = { type = "int(11)", nullable = false, source = "hubfiles.dataset_id" }
storage_key = { type = "varchar(255)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "written by hubfile's storage-migrate in E8" }
storage_status = { type = "varchar(16)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "written by hubfile's storage-migrate in E8" }
checksum_algo = { type = "varchar(16)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "hubfile's checksum_algorithm(checksum) (P-24)" }
content_sha256 = { type = "varchar(64)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "written by hubfile's storage-migrate in E8" }
artifact_type = { type = "varchar(32)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "uvl for a .uvl name, file otherwise (hubfile0002)" }
feature_model_id = { type = "int(11)", nullable = true, source = "hubfiles.feature_model_id", rule = "NULL when that feature model is not loaded" }

[tables.hubfile_metrics]
# Copied by name, every column, and made again in E9 by factlabel's
# metrics-backfill --force from each FactLabel it computes; a file whose
