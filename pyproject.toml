[build-system]
requires = [
    "setuptools>=80.3.1",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "uvlhub_splent"
version = "0.0.1"
description = "uvlhub_splent is an app built with SPLENT (https://www.splent.io)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "watchdog",
    "locust",
]
core = [
    "splent_framework",
]

[tool.splent]
cli_version = "1.42.0"
features = [
    "splent-io/splent_feature_academic_profile@v0.1.0",
    "splent-io/splent_feature_generator@v0.1.0",
    "splent-io/splent_feature_settings@v0.5.0",
    "splent-io/splent_feature_apidocs@v0.2.0",
    "splent-io/splent_feature_elasticsearch@v0.2.0",
    "splent-io/splent_feature_redis@v1.6.0",
    "splent-io/splent_feature_session_redis@v1.2.0",
    "splent-io/splent_feature_captcha_image@v0.2.0",
    "splent-io/splent_feature_profile@v1.7.1",
    "splent-io/splent_feature_captcha@v0.2.0",
    "splent-io/splent_feature_admin@v1.9.0",
    "splent-io/splent_feature_signup@v0.4.1",
    "splent-io/splent_feature_nginx@v1.5.0",
    "splent-io/splent_feature_theme@v0.15.0",
    "splent-io/splent_feature_public@v1.12.0",
    "splent-io/splent_feature_team@v0.9.0",
    "splent-io/splent_feature_media@v0.11.1",
    "splent-io/splent_feature_reset@v2.2.0",
    "splent-io/splent_feature_confirmemail@v2.2.0",
    "splent-io/splent_feature_mail@v1.5.0",
    "splent-io/splent_feature_orcid@v0.4.1",
    "splent-io/splent_feature_github@v0.4.1",
    "splent-io/splent_feature_autodeploy@v0.4.0",
    "splent-io/splent_feature_explore@v0.4.0",
    "splent-io/splent_feature_factlabel@v0.5.0",
    "splent-io/splent_feature_rating@v0.4.0",
    "splent-io/splent_feature_uvl@v0.1.0",
    "splent-io/splent_feature_statistics@v0.4.0",
    "splent-io/splent_feature_auth@v1.26.0",
    "splent-io/splent_feature_identities@v0.5.0",
    "splent-io/splent_feature_apikeys@v0.9.0",
    "splent-io/splent_feature_hubfile@v0.7.0",
    "splent-io/splent_feature_dataset@v0.7.0",
    "splent-io/splent_feature_zenodo@v0.4.0",
    "splent-io/splent_feature_backup@v0.1.0",
]
features_dev = ["splent-io/splent_feature_mailhog@v1.2.0", "splent-io/splent_feature_phpmyadmin@v1.1.0"]
features_prod = []
spl = "openhubs_spl"

# How a release publishes this product. A web product has no use for a PyPI
# package, and left undeclared a release would upload one that cannot be
# taken back, so a release tags the forge and pushes the image to the forge's
# container registry, whose stable tag is what autodeploy follows. The forge
# registry of splent-io is public. No Docker Hub mirror, where uvlhub.io's
# images with the commercial theme were published, until D9 is decided; and
# no release at all before D9 and the private staging of D3 say so.
[tool.splent.release]
channels = ["forge", "docker"]
registries = ["forge"]

# Where the SPL model itself comes from. The name above is not enough
# to download anything, so the DOI travels with the product and any
# clone of this repository can resolve the model from UVLHub alone.
[tool.splent.spl_model]
mirror = "uvlhub.io"
doi = "10.5281/zenodo.23614354"
# Same line, every version. Used to report that a newer model exists.
concept_doi = ""
version = "4"
file = "openhubs_spl.uvl"

[tool.splent.config]
SITE_NAME = "uvlhub"
SITE_TAGLINE = "Repository of feature models in UVL format"
# The monolith accepted 20 MB; media alone would raise the whole app to 100 MB.
MEDIA_MAX_UPLOAD_SIZE = "20M"
# Media is only the internal library for team photos and logos.
MEDIA_PUBLIC_GALLERY = false
# Accounts loaded from uvlhub.io start as plain users; staff are promoted by hand.
AUTH_MIGRATION_LEGACY_ROLE = "user"
# Sign-up and reset ask for the new password twice, as uvlhub did.
AUTH_PASSWORD_CONFIRM = true
# Decision D2: every address is verified before the account opens, with
# confirmemail; an account from ORCID with a typed address waits as well.
AUTH_REQUIRE_VERIFIED_EMAIL = true
# The sidebar logo already leads home, so the sidebar has no Home entry.
PUBLIC_SIDEBAR_HOME_LINK = false
# uvlhub.io heads its home with what it lists first, not with the site's
# name and tagline, in the band and in the browser tab.
PUBLIC_HOME_TITLE = "Top datasets with the most feature models"
# Off: the hint would tell anyone typing an address that the account exists
# and which provider (ORCID, GitHub) it signs in with.
EXTERNAL_LOGIN_PASSWORD_HINT = false
# Tokens carry the dataset scopes only, the ones dataset registers.
APIKEYS_SCOPES = ["read_dataset", "write_dataset"]
# A token issued without a choice can read datasets but not upload them.
APIKEYS_DEFAULT_SCOPES = ["read_dataset"]
# uvlhub's API clients send the token in X-API-Key as well as Bearer.
APIKEYS_HEADER_ALIASES = ["X-API-Key"]
# Only the sign-up asks for the captcha, as on uvlhub.io; the login and the
# request for a reset link do not.
CAPTCHA_PROTECTED_FORMS = ["signup"]
# The publisher named in every dataset's FAIR metadata, mails and API messages.
DATASET_PUBLISHER_NAME = "uvlhub"
# The catalog those metadata point to, the public site and not this host.
DATASET_CATALOG_URL = "https://www.uvlhub.io"
# The ball drawn in the middle of the PNG and JPG QR codes.
DATASET_QR_LOGO = "media/logos/uvlhub_ball.png"
# uvlhub.io lists first the datasets with the most feature models
# (01 §5.5): those that hold the most items, uvl's UVL models.
DATASET_HOME_ORDER = "items"
# uvlhub.io 2.12 deposited the whole folder of a dataset, its UVL models and
# what uvl derives from them (Glencoe, DIMACS, SPLOT), so the records keep
# carrying both.
DATASET_DEPOSIT_CONTENT = "sources_and_derived"
# uvlhub.io 2.12 gave every deposit the keyword uvlhub after the dataset's
# own tags, so the hub's records are found together on Zenodo.
ZENODO_KEYWORDS = ["uvlhub"]
# What a backup archives with the database: every storage root, the targets
# of the named volumes of docker/docker-compose.prod.yml (the protected
# uploads, where hubfile keeps the dataset files, the public uploads and the
# archive). A deployment that moves PROTECTED_UPLOADS_DIR or ARCHIVE_DIR
# sets BACKUP_PATHS in its .env as well.
BACKUP_PATHS = [
    "/workspace/uvlhub_splent/protected_uploads",
    "/workspace/uvlhub_splent/src/uvlhub_splent/static/uploads",
    "/workspace/uvlhub_splent/archive",
]
# The rows that name a file, which backup's verify and its restore drill
# look for on disk: every file of a dataset, with the size its row says.
BACKUP_VERIFY_FILES = ["Hubfile.get_full_path:size"]
# /team lists every organisation behind uvlhub, with its logo, description
# and website, whether or not it lists people yet.
TEAM_SHOW_EMPTY_ROLES = true
# A member's card writes the address itself, as uvlhub.io's, not "Email".
TEAM_CARD_EMAIL_ADDRESS = true
# uvlhub.io shows the trail on every page below the home: Home / Team.
SITE_BREADCRUMBS = "all"
# uvlhub.io's palette and Inter for theme's public shell, which in uvlhub
# draws the page of an address that leads nowhere (errors/404.html). No
# font_url: Inter comes from the product (css/uvlhub-error.css), never from
# Google. A JSON object, as theme reads it; each line ends in a backslash,
# so TOML joins them into the one line the environment carries.
THEME_TOKENS = """{\
"primary": "#1b84ff", "primary_contrast": "#ffffff", "accent": "#287fb9", \
"bg": "#ffffff", "surface": "#f9f9f9", "text": "#071437", \
"heading": "#071437", "muted": "#99a1b7", "border": "#f1f1f4", \
"radius": ".475rem", \
"font_body": "Inter, Helvetica, sans-serif", \
"font_heading": "Inter, Helvetica, sans-serif", \
"font_display": "Inter, Helvetica, sans-serif", \
"font_url": ""}"""

[tool.splent.layout]
base_template = "base_template.html"
hooks = [
    "layout.head.css",
    "layout.sidebar.top",
    "layout.anonymous_sidebar",
    "layout.authenticated_sidebar",
    "layout.sidebar.authenticated.items",
    "layout.navbar.anonymous",
    "layout.header.menu",
    "layout.navbar.items",
    "layout.navbar.authenticated",
    "layout.footer",
    "layout.scripts",
]

[tool.splent.layout.menu]
# uvlhub.io lists Team third, after Explore and the Dashboard.
order = { team = 30 }

[tool.splent.test]
# What product:test hands the product's own tests from the caller's
# environment: the throwaway MariaDB of the migrator's tests, which
# tests/migration_v2/run_with_throwaway_db.sh starts and names.
env = ["MIGRATION_V2_TEST_*"]

# What the production image installs besides the features. splent
# product:build keeps splent_framework and splent_cli at the versions this
# product is built with; a bare version means exactly that version.
[tool.splent.runtime]
splent_framework = "1.24.0"
splent_cli = "1.42.0"
gunicorn = ">=23,<24"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]
