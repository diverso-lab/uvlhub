services:

  uvlhub_splent_web_deploy:
    # The image product:build made on this host, unless SPLENT_IMAGE in
    # deploy/.env names one a release published to a registry (for example
    # the stable channel, which the autodeploy feature follows). The deploy
    # bundle product:build writes defaults to the published image.
    image: ${SPLENT_IMAGE:-uvlhub_splent:latest}
    container_name: uvlhub_splent_web_deploy
    # Back up after a host reboot, a docker daemon restart or an OOM kill.
    # Only an explicit `docker stop` (or product:deploy --down) keeps it down.
    restart: unless-stopped
    env_file:
      - ../deploy/.env
    environment:
      # The storage roots, at the targets of their named volumes below. Set
      # here, from the same expression as each mount's target, the app and
      # the volume cannot disagree: an empty or deleted line in deploy/.env
      # moves both, never one, so no file is ever written to the container's
      # own layer and lost with it. Dataset files live under
      # PROTECTED_UPLOADS_DIR.
      PROTECTED_UPLOADS_DIR: ${PROTECTED_UPLOADS_DIR:-/workspace/uvlhub_splent/protected_uploads}
      ARCHIVE_DIR: ${ARCHIVE_DIR:-/workspace/uvlhub_splent/archive}
    ports:
      # Host interface and port for the web app, from SPLENT_WEB_BIND_HOST
      # and SPLENT_WEB_PORT in deploy/.env. Every interface by default;
      # 127.0.0.1 is the right value when a proxy on the host terminates TLS
      # and forwards traffic to loopback.
      - "${SPLENT_WEB_BIND_HOST:-0.0.0.0}:${SPLENT_WEB_PORT:-5012}:5000"
    volumes:
      # Uploaded and generated files live inside the container and are lost
      # on every redeploy unless they are kept on named volumes.
      - uvlhub_splent_web_deploy_uploads:/workspace/uvlhub_splent/src/uvlhub_splent/static/uploads
      - uvlhub_splent_web_deploy_protected_uploads:${PROTECTED_UPLOADS_DIR:-/workspace/uvlhub_splent/protected_uploads}
      - uvlhub_splent_web_deploy_archive:${ARCHIVE_DIR:-/workspace/uvlhub_splent/archive}
      # Where splent_feature_backup sends the backups, BACKUP_DESTINATION
      # =/backups: a disk of another machine, mounted on the host at
      # BACKUP_HOST_DIR. A bind mount, never a named volume, which would be
      # on the very disk it backs up.
      - ${BACKUP_HOST_DIR:?mount the off-host backup disk and name it in BACKUP_HOST_DIR}:/backups
    depends_on:
      uvlhub_splent_db_deploy:
        condition: service_healthy
    networks:
      - splent_network
    command: [ "bash", "-c", "bash /workspace/uvlhub_splent/entrypoints/entrypoint.prod.sh" ]
    # Python is in every production image, so the probe needs no extra
    # package. Ready, not just alive: the framework's /readyz answers 200
    # when the database and the services the product declares answer,
    # before any of the app's code runs and whatever the Host. An app
    # without it is asked at "/", where any answer below 500 will do.
    # product:build writes the same probe (WEB_HEALTH_PROBE). The start
    # period covers a cold start, which runs every migration first.
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client as h\ndef status(path):\n    c = h.HTTPConnection('127.0.0.1', 5000, timeout=4)\n    c.request('GET', path)\n    return c.getresponse().status\nready = status('/readyz')\nok = ready == 200 if ready in (200, 503) else status('/') < 500\nraise SystemExit(not ok)\n"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  uvlhub_splent_db_deploy:
    image: mariadb:11.4
    container_name: uvlhub_splent_db_deploy
    restart: unless-stopped
    env_file:
      - ../deploy/.env
    command: --default-authentication-plugin=mysql_native_password
    ports:
      # The web container reaches the database over the project network, so
      # this port only serves tooling on the host itself, and it is published
      # on loopback unless SPLENT_DB_BIND_HOST in deploy/.env says otherwise.
      - "${SPLENT_DB_BIND_HOST:-127.0.0.1}:${SPLENT_DB_PORT:-33072}:3306"
    volumes:
      - uvlhub_splent_db_deploy_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - splent_network

volumes:
  uvlhub_splent_db_deploy_data:
  uvlhub_splent_web_deploy_uploads:
  uvlhub_splent_web_deploy_protected_uploads:
  uvlhub_splent_web_deploy_archive:

networks:
  splent_network:
    external: true
    name: ${SPLENT_NETWORK:-splent_network}
