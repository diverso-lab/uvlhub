# The data contract of uvlhub 3.0 that the migrator of uvlhub.io 2.12 writes
# to (MIG-03, §3.4 of the migration plan).
#
# It says what the schema of the pinned features looks like where the
# migrator touches it, and where every column it fills comes from. The
# migrator reads it twice: E0 refuses to run on features of other versions
# than [features] names, and E3 refuses a uvlhub3 that differs from
# [tables] (V-12, V-14). tests/migration_v2/test_contract.py compares it with
# the schema the pinned features create, so a pin that changes a table the
# migration fills fails there first. Every change of F1 to F5 that touches
# data carried over updates this file and the migrator in the same commit
# (plancha:41).
#
# Tables have a role:
#   load   the migrator writes it. Its columns are the table's, all of them,
#          each with where it comes from: `source` (a v2.12 column copied as
#          it is) and/or `rule` (what the migrator computes), and `on_null`
#          when the source admits NULL and the target does not (C-27).
#   read   the migrator reads the columns listed (a subset), and writes nothing.
#   empty  the migrator writes nothing, and E7 checks that nothing else did
#          either (a seed, a listener). Its columns are the feature's business.
# `owner` is the feature whose migrations create the table.
#
# Collations (DM-15): the database's default for every text column, but
# where the column says otherwise. `dm15` names the collation DM-15 asks for
# where the pinned feature does not give it yet: V-14 checks `collation`,
# what the schema is, and the report lists every `dm15` still pending.

[contract]
version = 1
plan = "_reference/analisis_uvlhub/06-plan-migracion-uvlhubio.md, revision 2"

[database]
charset = "utf8mb4"
collation = "utf8mb4_unicode_ci"

# The heads the migrator was written against: feature, version and the last
# revision db:upgrade records for it in splent_migrations. Every feature with
# migrations of the product, so V-12 compares the whole of splent_migrations.
[features]
splent_feature_academic_profile = { version = "0.1.0", head = "pu0002" }
splent_feature_apikeys = { version = "0.8.0", head = "apikeys0002_lifecycle" }
splent_feature_auth = { version = "1.25.0", head = "auth0007_service_account" }
splent_feature_confirmemail = { version = "2.2.0", head = "126da35a357f" }
splent_feature_dataset = { version = "0.6.0", head = "dataset0004_orphan_metadata" }
splent_feature_factlabel = { version = "0.5.0", head = "d934ec20c841" }
splent_feature_github = { version = "0.4.1", head = "github0002_into_ext_identity" }
splent_feature_hubfile = { version = "0.6.0", head = "hubfile0003_upload_sessions" }
splent_feature_identities = { version = "0.4.1", head = "identities0002_one_per_provider" }
splent_feature_mail = { version = "1.5.0", head = "mail0001_outbox" }
splent_feature_media = { version = "0.11.1", head = "media0005_thumbnail" }
splent_feature_orcid = { version = "0.4.1", head = "orcid0002_into_external_identity" }
splent_feature_profile = { version = "1.7.1", head = "29f0c82ca134" }
splent_feature_rating = { version = "0.4.0", head = "3e72750db961" }
splent_feature_reset = { version = "2.2.0", head = "1c2ed70161dd" }
splent_feature_settings = { version = "0.5.0", head = "settings0001" }
splent_feature_statistics = { version = "0.4.0", head = "d46494928bf8" }
splent_feature_team = { version = "0.9.0", head = "tm0004_role_details" }
splent_feature_uvl = { version = "0.1.0", head = "846acdf9eed2" }

# The heads of v2.12 the dump may be at (MIGRATION_EXPECTED_HEAD): the
# release, or the hotfix D1, whose revision only rewrites descriptions.
[source]
heads = ["e5f6a7b8c9d0", "f7a8b9c0d1e2"]

# The scopes of a v2.12 key and the ones the token keeps. The pinned dataset
# registers uvlhub's own names (read_dataset, write_dataset), so they stay as
# they were; AP-4's datasets:* vocabulary does not exist in 3.0 yet. A scope
# not named here is dropped from the token, and counted.
[scopes]
read_dataset = "read_dataset"
write_dataset = "write_dataset"

# What DM-15 asks for that no pinned feature has: E5 cannot fill a column
# that does not exist. The report lists them with the `dm15` columns.
[dm15]
missing = [
    "datasets.pid (DL-12, D14: dataset_doi stays in ds_meta_data)",
    "datasets.concept_pid (dataset_concept_doi stays in ds_meta_data)",
    "dataset_tag.name (C-23: tags stay a string in ds_meta_data.tags)",
]

[tables.user]
owner = "splent_feature_auth"
role = "load"

[tables.user.columns]
id = { type = "int(11)", nullable = false, source = "user.id" }
email = { type = "varchar(256)", nullable = true, collation = "utf8mb4_unicode_ci", dm15 = "utf8mb4_bin", source = "user.email" }
password = { type = "varchar(256)", nullable = false, collation = "utf8mb4_unicode_ci", source = "user.password", rule = "copied as it is; a takeover candidate whose link was followed gets UNUSABLE_PASSWORD instead (C-28)" }
created_at = { type = "datetime", nullable = false, source = "user.created_at" }
role = { type = "varchar(32)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "admin for MIGRATION_ADMIN_EMAILS, user otherwise (5.3)" }
email_canonical = { type = "varchar(256)", nullable = true, collation = "utf8mb4_bin", rule = "auth's canonical_email(user.email)" }
pending_email = { type = "varchar(256)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "NULL" }
email_verified_at = { type = "datetime", nullable = true, rule = "when the earliest positive proof was made (5.1), NULL without one" }
disabled_at = { type = "datetime", nullable = true, rule = "T0 when user.active = 0" }
last_login_at = { type = "datetime", nullable = true, rule = "NULL" }
password_changed_at = { type = "datetime", nullable = true, rule = "NULL" }
session_version = { type = "int(11)", nullable = false, rule = "2, which ends every remember-me cookie of v2.12 (5.4)" }
account_origin = { type = "varchar(32)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "legacy_v2" }
email_verified_via = { type = "varchar(32)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "legacy_reset or legacy_github, NULL without a proof" }
has_usable_password = { type = "tinyint(1)", nullable = false, rule = "5.2 heuristic; false for a takeover candidate" }
is_service_account = { type = "tinyint(1)", nullable = false, rule = "false" }

[tables.user_profile]
owner = "splent_feature_profile"
role = "load"

[tables.user_profile.columns]
id = { type = "int(11)", nullable = false, source = "user_profile.id" }
user_id = { type = "int(11)", nullable = false, source = "user_profile.user_id" }
name = { type = "varchar(100)", nullable = false, collation = "utf8mb4_unicode_ci", source = "user_profile.name", rule = "stripped" }
surname = { type = "varchar(100)", nullable = false, collation = "utf8mb4_unicode_ci", source = "user_profile.surname", rule = "stripped" }
affiliation = { type = "varchar(255)", nullable = true, collation = "utf8mb4_unicode_ci", source = "user_profile.affiliation", rule = "stripped; academic_profile adds the column" }

[tables.external_identity]
owner = "splent_feature_identities"
role = "load"

[tables.external_identity.columns]
id = { type = "int(11)", nullable = false, source = "external_identity.id", rule = "kept; a row folded in from orcid or github takes a new one above the source counter" }
user_id = { type = "int(11)", nullable = false, source = "external_identity.user_id" }
provider = { type = "varchar(50)", nullable = false, collation = "utf8mb4_unicode_ci", source = "external_identity.provider" }
provider_id = { type = "varchar(256)", nullable = false, collation = "utf8mb4_unicode_ci", dm15 = "utf8mb4_bin", source = "external_identity.provider_id", rule = "orcid.orcid_id normalised, or github.github_id as text, for a folded row (5.6)" }
provider_username = { type = "varchar(256)", nullable = true, collation = "utf8mb4_unicode_ci", source = "external_identity.provider_username", rule = "the iD, or github.github_login, when it had none (orcid0002, github0002)" }
created_at = { type = "datetime", nullable = false, source = "external_identity.created_at", rule = "the earlier of the two dates of a folded row" }
provider_email_verified = { type = "varchar(256)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "external_identity.email of a github row when it is the account's address (identities0002)" }

[tables.api_token]
owner = "splent_feature_apikeys"
role = "load"

[tables.api_token.columns]
id = { type = "int(11)", nullable = false, source = "api_keys.id" }
user_id = { type = "int(11)", nullable = false, source = "api_keys.user_id" }
name = { type = "varchar(128)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "'uvlhub 2 key (<created_at date>)'" }
token_hash = { type = "varchar(64)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "sha256(api_keys.key)" }
prefix = { type = "varchar(16)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "api_keys.key[:15]" }
scopes = { type = "varchar(256)", nullable = false, collation = "utf8mb4_unicode_ci", rule = "api_keys.scopes through [scopes] below; a key whose scopes all go is carried over revoked" }
created_at = { type = "datetime", nullable = false, source = "api_keys.created_at", on_null = "api_keys.last_used_at, else T0 (D12)" }
expires_at = { type = "datetime", nullable = true, rule = "T0 + 90 days with write_dataset, 365 otherwise (D12)" }
revoked_at = { type = "datetime", nullable = true, rule = "T0 for a key carried over revoked (D12)" }
last_used_at = { type = "datetime", nullable = true, source = "api_keys.last_used_at" }
revoked_reason = { type = "varchar(32)", nullable = true, collation = "utf8mb4_unicode_ci", rule = "import_no_scopes, import_never_used or import_unused (D12)" }
expiry_notice_days = { type = "int(11)", nullable = true, rule = "NULL" }

[tables.ds_metrics]
owner = "splent_feature_dataset"
role = "load"

[tables.ds_metrics.columns]
