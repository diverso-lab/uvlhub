hubfile_id = { type = "int(11)", nullable = false, source = "hubfile_metrics.hubfile_id" }
extracted_at = { type = "datetime", nullable = false, source = "hubfile_metrics.extracted_at" }
extractor_version = { type = "varchar(20)", nullable = false, collation = "utf8mb4_unicode_ci", source = "hubfile_metrics.extractor_version" }
parse_error = { type = "text", nullable = true, collation = "utf8mb4_unicode_ci", source = "hubfile_metrics.parse_error" }
