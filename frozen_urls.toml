# Frozen URLs of uvlhub (CO-1)
#
# Every public address uvlhub.io 2.12 hands out that uvlhub 3.0 keeps
# answering: all the rows of the table in 06-plan-migracion-uvlhubio.md
# §4.4, one entry per Flask rule or request header. tests/test_frozen_urls.py
# compares the entries with the url_map of the app this product builds, so
# the manifest says what the product serves today, not what it is meant to
# serve one day.
#
# Each [[url]] entry has
#
#   rows       the rows of the §4.4 table it comes from (1 to 19)
#   rule       the Flask rule, as the 2.12 monolith declared it
#   methods    the methods clients call it with
#   v212       where the monolith served it ("mono" is uvlhub_monolith/app)
#   clients    who calls it
#   target     what it is in 3.0
#   status     served         a feature or the product serves it today
#              alias-pending  3.0 has to answer it (an alias, a bridge or a
#                             route) and nothing does yet
#              gone-pending   3.0 has to answer it with a redirect or a 410
#                             saying where it went, and nothing does yet
#   endpoint   served: the endpoint that answers it
#   served_by  served: the feature or the product that owns that endpoint
#   plan       pending: the plan item that closes it. served: the work still
#              owed on how it answers, when there is some
#   note       anything else
#
# An entry a client calls from its own site also has
#
#   cors_origin      that site. It gets its own origin back, with
#                    credentials, on the request and on the preflight, and
#                    any other site gets no CORS at all
#   signed_out_keys  the keys of the 401 a caller with neither a session
#                    nor a token gets, which the client reads to send them
#                    to sign in
#
# A header is an entry with kind = "header" instead of a rule: header names
# it and config the setting that makes the product read it.
#
# When a feature release starts or stops serving a rule, or a served one
# stops answering as cors_origin and signed_out_keys say, the test fails
# until the entry says so. Those two are checked once the entry is served.

