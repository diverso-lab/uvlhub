# ── 9 and 10. REST API v1: /api/v1/datasets* and /api/v1/files* ──────────
# The 19 rules of mono/app/features/dataset/routes.py:1000-2451. In 3.0
# only additive changes: checksum stays and checksum_algorithm is added
# (D5, PB-2). The upload is also row 12.

[[url]]
rows = [9, 12]
rule = "/api/v1/datasets/upload"
methods = ["POST"]
v212 = "mono/app/features/dataset/routes.py:1000"
clients = ["marketplace", "scripts", "flamapyIDE (with the session)"]
target = "Additive changes only. The IDE's session upload goes through uvl or a bridge (UV-11)"
status = "served"
endpoint = "dataset.api_upload_dataset"
served_by = "dataset"
plan = "UV-11"
cors_origin = "https://ide.flamapy.org"
signed_out_keys = ["authenticated", "message", "login_url", "signup_url", "orcid_url"]
note = """The CORS that opens it to FLAMAPY_IDE_ORIGINS with credentials is \
dataset's up to 0.1.1, featuremodel's from 0.1.1 to 0.4.0, and uvl's from \
0.1.0 on, the UVL layer: pin uvl in the commit that drops featuremodel, or \
the upload has no CORS and cors_origin fails. The message of the signed-out \
401 changed in dataset 0.1.2, keys unchanged: 2.12 said "You need to sign in \
before saving a model from flamapyIDE to UVLHub." and 3.0 says "You need to \
sign in before uploading to uvlhub.", since dataset is not the UVL layer. \
/api/v1/auth/status keeps the 2.12 wording. The contract owner accepts the \
change or asks for the old text back. Since dataset 0.7.0 the upload \
takes an optional Idempotency-Key (PB-2): the same key and call get the \
first answer back for a day, with Idempotent-Replayed: true. Its 409 (the \
key still being processed) and 422 (the key sent with another call) are \
answered only when the header is sent, so a client of 2.12, which sends \
none, sees no new status"""

[[url]]
rows = [9, 10]
rule = "/api/v1/datasets/<int:dataset_id>/publish"
methods = ["POST"]
v212 = "mono/app/features/dataset/routes.py:1148"
clients = ["marketplace (irreversible call)"]
target = "Additive changes only. 423 with Retry-After and {\"error\":\"publication_paused\"} during the cutover window and the retention, never a 5xx or a 202"
status = "served"
endpoint = "dataset.api_publish_dataset"
served_by = "dataset"
plan = "PB-2"
note = """The 423 is answered by nginx during the cutover (06 §9.3), not by \
the app, and "never a 5xx or a 202" now holds for it alone. Since dataset \
0.7.0 (PB-2, D5 option a, which the contract owner accepted, with the \
change from 2.12's 200 with a null DOI to an error status) the call \
waits at most DATASET_PUBLISH_WAIT seconds (540 in production) and answers \
200 only with the identifier minted; past the wait a 503 \
publication_pending with status_url, which a client must not read as \
nothing minted. 202 only to a request with Prefer: respond-async; 409 for \
a publication under way, or an Idempotency-Key still being processed; 429 \
for an account with too many publications under way \
(DATASET_PUBLISH_MAX_IN_FLIGHT, no limit in production); 422 when the \
provider refuses the metadata, or the Idempotency-Key came with another \
call. The 200 adds pid, pid_scheme, provider and landing_url"""

