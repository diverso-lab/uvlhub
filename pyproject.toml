[build-system]
requires = [
    "setuptools>=80.3.1",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "uvlhub_splent"
version = "3.0.0"
description = "uvlhub_splent is an app built with SPLENT (https://www.splent.io)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "watchdog>=4,<7",
    "locust",
]
core = [
    "splent_framework",
]

[tool.splent]
cli_version = "1.49.0"
features = [
    "splent-io/splent_feature_academic_profile@v0.2.0",
    "splent-io/splent_feature_elasticsearch@v0.3.0",
    "splent-io/splent_feature_redis@v1.7.0",
    "splent-io/splent_feature_session_redis@v1.3.0",
    "splent-io/splent_feature_captcha_image@v0.3.0",
    "splent-io/splent_feature_captcha@v0.3.0",
    "splent-io/splent_feature_admin@v1.10.0",
    "splent-io/splent_feature_signup@v0.5.0",
    "splent-io/splent_feature_nginx@v1.7.0",
    "splent-io/splent_feature_theme@v0.17.0",
    "splent-io/splent_feature_public@v1.13.0",
    "splent-io/splent_feature_hub_shell@v0.2.0",
    "splent-io/splent_feature_orcid@v0.5.0",
    "splent-io/splent_feature_github@v0.5.0",
    "splent-io/splent_feature_autodeploy@v0.5.0",
    "splent-io/splent_feature_identities@v0.6.0",
    "splent-io/splent_feature_apikeys@v0.11.0",
    "splent-io/splent_feature_zenodo@v0.6.0",
    "splent-io/splent_feature_backup@v0.2.0",
    "splent-io/splent_feature_curation@v0.2.0",
    "splent-io/splent_feature_observability@v0.2.0",
    "splent-io/splent_feature_audit@v0.2.0",
    "splent-io/splent_feature_analytics@v0.2.0",
    "splent-io/splent_feature_rating@v0.7.0",
    "splent-io/splent_feature_explore@v0.10.0",
    "splent-io/splent_feature_factlabel@v0.8.1",
    "splent-io/splent_feature_statistics@v0.7.0",
    "splent-io/splent_feature_citation@v0.3.0",
    "splent-io/splent_feature_settings@v0.6.0",
    "splent-io/splent_feature_media@v0.13.0",
    "splent-io/splent_feature_team@v0.10.0",
    "splent-io/splent_feature_uvl@v0.6.0",
    "splent-io/splent_feature_auth@v1.28.0",
    "splent-io/splent_feature_profile@v1.9.0",
    "splent-io/splent_feature_confirmemail@v2.4.0",
    "splent-io/splent_feature_reset@v2.4.0",
    "splent-io/splent_feature_mail@v1.7.0",
    "splent-io/splent_feature_hubfile@v0.13.0",
    "splent-io/splent_feature_dataset@v0.16.1",
    "splent-io/splent_feature_generator@v0.4.0",
    "splent-io/splent_feature_apidocs@v0.5.0",
    "splent-io/splent_feature_legacy_urls@v0.2.0",
    "splent-io/splent_feature_dataset_api@v0.5.1",
    "splent-io/splent_feature_dataset_transfer@v0.2.0",
    "splent-io/splent_feature_icons@v0.1.0",
    "splent-io/splent_feature_search@v0.5.0",
]
features_dev = ["splent-io/splent_feature_mailhog@v1.3.0", "splent-io/splent_feature_phpmyadmin@v1.2.0"]
features_prod = []
spl = "openhubs_spl"

[tool.splent.release]
channels = ["forge", "docker"]
registries = ["forge"]

[tool.splent.spl_model]
mirror = "uvlhub.io"
doi = "10.5281/zenodo.23859989"
concept_doi = ""
version = "11"
file = "openhubs_spl.uvl"

[tool.splent.config]
SITE_NAME = "uvlhub"
SITE_TAGLINE = "Repository of feature models in UVL format integrated with Zenodo and FlamaPy"
SITE_LOGO = "media/logos/default-dark.svg"
HUB_SHELL_LOGO_COMPACT = "media/logos/uvlhub_ball.png"
HUB_SHELL_FOOTER_YEAR = "2025"
HUB_SHELL_FOOTER_CREDITS = "University of Seville · University of Malaga · University of Ulm"
HUB_SHELL_REPOSITORY_URL = "https://github.com/diverso-lab/uvlhub"
MEDIA_MAX_UPLOAD_SIZE = "20M"
MEDIA_PUBLIC_GALLERY = false
AUTH_MIGRATION_LEGACY_ROLE = "user"
AUTH_PASSWORD_CONFIRM = true
AUTH_REQUIRE_VERIFIED_EMAIL = true
PUBLIC_SIDEBAR_HOME_LINK = false
PUBLIC_HOME_TITLE = "Top datasets with the most feature models"
EXTERNAL_LOGIN_PASSWORD_HINT = false
APIKEYS_SCOPES = ["read_dataset", "write_dataset"]
APIKEYS_DEFAULT_SCOPES = ["read_dataset"]
APIKEYS_HEADER_ALIASES = ["X-API-Key"]
CAPTCHA_PROTECTED_FORMS = ["signup"]
DATASET_PUBLISHER_NAME = "uvlhub"
DATASET_CATALOG_URL = "https://www.uvlhub.io"
DATASET_QR_LOGO = "media/logos/uvlhub_ball.png"
DATASET_HOME_ORDER = "items"
DATASET_PUBLISH_POLICY = "curated"
CURATION_TRUSTED_ACCOUNTS = "carried_over"
OBSERVABILITY_BACKEND = "glitchtip"
OBSERVABILITY_ALERT_CHANNELS = ["email", "matrix"]
ANALYTICS_PROVIDER = "plausible"
SPLENT_DERIVED_KEYS = true
CITATION_REFERENCES_FILE = "citation_references.toml"
DATASET_DEPOSIT_CONTENT = "sources_and_derived"
ZENODO_KEYWORDS = ["uvlhub"]
UVL_MAX_SIZE = "20M"
BACKUP_PATHS = [
    "/workspace/uvlhub_splent/protected_uploads",
    "/workspace/uvlhub_splent/src/uvlhub_splent/static/uploads",
    "/workspace/uvlhub_splent/archive",
]
BACKUP_VERIFY_FILES = ["Hubfile.get_full_path:size"]
TEAM_SHOW_EMPTY_ROLES = true
TEAM_CARD_EMAIL_ADDRESS = true
SITE_BREADCRUMBS = "all"
THEME_TOKENS = """{\
"primary": "#0b6fe0", "primary_contrast": "#ffffff", "accent": "#1f6fa3", \
"bg": "#ffffff", "surface": "#f9f9f9", "text": "#071437", \
"heading": "#071437", "muted": "#646c82", "border": "#f1f1f4", \
"radius": ".475rem", \
"font_body": "Inter, Helvetica, sans-serif", \
"font_heading": "Inter, Helvetica, sans-serif", \
"font_display": "Inter, Helvetica, sans-serif", \
"font_url": ""}"""

[tool.splent.csp]
generator = ["script-src 'wasm-unsafe-eval'", "connect-src https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com"]

[tool.splent.layout.menu]
order = { team = 30 }

[tool.splent.test]
env = ["MIGRATION_V2_TEST_*"]

[tool.splent.runtime]
splent_framework = "1.30.0"
splent_cli = "1.50.1"
gunicorn = ">=23,<24"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.setuptools.package-data]
"uvlhub_splent" = ["citation_references.toml"]
"uvlhub_splent.migration_v2" = ["contract.toml", "curation.toml"]
